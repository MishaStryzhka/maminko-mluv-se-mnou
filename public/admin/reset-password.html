<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Nové heslo · Maminko, mluv se mnou</title>
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/admin-password-reset.css" />
</head>
<body data-password-reset="complete">
    <main class="password-reset-page">
        <section class="password-reset-card" aria-labelledby="reset-title">
            <span class="eyebrow">ADMINISTRACE</span>
            <h1 id="reset-title">Nastavit nové heslo</h1>
            <p id="reset-intro">Zvolte nové heslo pro svůj účet. Po změně budou ukončena všechna dosavadní přihlášení a přihlásíte se znovu.</p>
            <form id="password-reset-form" method="post" action="/api/admin-password-reset" hidden>
                <fieldset id="reset-fields" disabled>
                    <legend class="visually-hidden">Nastavení nového hesla</legend>
                    <label for="reset-password">Nové heslo</label>
                    <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required aria-describedby="password-help" />
                    <p class="field-help" id="password-help">Použijte 12 až 200 znaků. Můžete vložit heslo ze správce hesel.</p>
                    <label for="reset-password-confirm">Nové heslo znovu</label>
                    <input id="reset-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required aria-describedby="password-help" />
                    <button type="submit" class="primary-action" id="reset-submit">Uložit nové heslo</button>
                </fieldset>
            </form>
            <p id="reset-message" class="reset-message" role="status" aria-live="polite" tabindex="-1" hidden></p>
            <noscript><p>Pro bezpečné obnovení hesla je potřeba zapnout JavaScript. Potom znovu otevřete odkaz z e-mailu.</p></noscript>
            <nav class="reset-actions" aria-label="Možnosti přihlášení">
                <a class="reset-link" href="/admin/orders">Zpět na přihlášení</a>
                <a class="reset-link" id="new-reset-link" href="/admin/forgot-password">Požádat o nový odkaz</a>
            </nav>
        </section>
    </main>
    <script src="/admin-password-reset.js"></script>
</body>
</html>
