name: Preview DB health

on:
  push:
    branches:
      - preview/checkout-balikovna
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel preview and verify Neon
        id: health
        shell: bash
        run: |
          set -uo pipefail
          URL="https://maminko-mluv-se-mnou-preview-git-preview-chec-9817f8-g-d7a9e92a.vercel.app/api/db-health"
          : > db-health-result.txt
          state="failed"

          for attempt in {1..30}; do
            response="$(curl --silent --show-error --location --max-time 10 --write-out '\n%{http_code}' "$URL" || true)"
            body="$(printf '%s\n' "$response" | sed '$d')"
            status="$(printf '%s\n' "$response" | tail -n1)"

            {
              echo "attempt=$attempt"
              echo "http_status=$status"
              echo "body=$body"
            } > db-health-result.txt

            echo "Attempt $attempt: HTTP $status"

            if [ "$status" = "200" ] && echo "$body" | grep -q '"schemaReady":true'; then
              state="healthy"
              break
            fi

            # Vercel Deployment Protection can return the Vercel sign-in HTML with HTTP 200.
            # In that case GitHub Actions cannot verify the protected endpoint without a bypass token.
            if echo "$body" | grep -Eq 'sso-api|Continue with GitHub|Continue with ChatGPT'; then
              state="protected"
              echo "Vercel preview is protected; skipping external DB assertion."
              break
            fi

            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              state="protected"
              echo "Vercel preview is protected (HTTP $status); skipping external DB assertion."
              break
            fi

            sleep 5
          done

          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized health result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-db-health-result
          path: db-health-result.txt
          if-no-files-found: error
          retention-days: 1

      - name: Report protected preview
        if: steps.health.outputs.state == 'protected'
        run: echo "Preview is protected by Vercel Authentication. Manual /api/db-health verification is required."

      - name: Require healthy database when endpoint is reachable
        if: steps.health.outputs.state == 'failed'
        run: |
          echo "Preview database health check is not ready."
          exit 1
